[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-engineering-course"
version = "0.1.0"
description = "Offline teaching harness for an Agent engineering course"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mcp = ["mcp>=2.1,<3"]
openai-agents = ["openai-agents>=0.2"]
deepseek = ["openai>=2,<3"]
qt = ["PySide6>=6.7,<7"]

[project.scripts]
agent-course-demo = "agent_course.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["live: requires an explicit real-provider opt in and may incur cost"]

[tool.ruff]
line-length = 100
target-version = "py311"
